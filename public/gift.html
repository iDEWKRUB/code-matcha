<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODE-MATCHA มีของขวัญในแก้วของคุณ</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Mitr:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #F3F7EC; --sky-dot: #E7EFDA;
    --berry: #6B8C3A; --berry-dark: #4C6826;
    --gold: #F3EAD0; --ink: #2E3522; --paper: #FFFFFF; --muted: #6B5A52;
    --line: #3A3325;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sky: #1E2A18; --sky-dot: #263520; --ink: #F1F4E8; --paper: #2C3826; --muted: #C4CCB4; }
  }
  :root[data-theme="dark"] { --sky: #1E2A18; --sky-dot: #263520; --ink: #F1F4E8; --paper: #2C3826; --muted: #C4CCB4; }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; overflow-x: hidden;
    font-family: "Mali", "Mitr", "Noto Sans Thai", system-ui, sans-serif;
    color: var(--ink); background-color: var(--sky);
    background-image: radial-gradient(var(--sky-dot) 22%, transparent 23%);
    background-size: 34px 34px;
    display: flex; flex-direction: column; align-items: center;
  }
  main { width: 100%; max-width: 420px; padding: 36px 22px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  h1 { text-wrap: balance; font-family: "Mitr", system-ui, sans-serif; font-weight: 600; font-size: clamp(1.7rem, 7.5vw, 2.2rem); line-height: 1.25; margin: 0 0 6px; }
  .sub { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.6; min-height: 1.7em; }

  .name-field { margin: 16px 0 0; width: 100%; max-width: 280px; }
  .name-field input {
    width: 100%; font: 700 1.1rem "Mali", system-ui, sans-serif; color: var(--ink); text-align: center;
    background: var(--paper); border: 4px solid var(--line); border-radius: 999px; padding: 10px 18px;
    box-shadow: 0 5px 0 var(--line); outline: none;
  }
  .name-field input::placeholder { color: var(--muted); font-weight: 500; }
  .name-field input:focus-visible { border-color: var(--berry); box-shadow: 0 5px 0 var(--berry); }
  .open-state .name-field { display: none; }

  /* ===== เวที: ตัวการ์ตูนซ่อนอยู่หลังกล่อง ===== */
  .stage { position: relative; width: 260px; height: 392px; margin: 18px 0 10px; }
  .gift { all: unset; cursor: pointer; position: absolute; inset: 0; border-radius: 14px; -webkit-tap-highlight-color: transparent; }
  .gift:focus-visible { outline: 3px solid var(--berry); outline-offset: 6px; }

  .buddy {
    position: absolute; left: 50%; bottom: 6px; width: 180px; height: 236px;
    margin-left: -90px; z-index: 1; transform-origin: 50% 100%;
    transform: translateY(0) scale(.6);
    transition: transform .7s cubic-bezier(.3,1.6,.5,1) .15s;
  }
  .open .buddy { animation: riseSettle 1.7s cubic-bezier(.4,1.3,.5,1) .1s forwards; }
  @keyframes riseSettle {
    0%   { transform: translateY(0) scale(.6); }
    40%  { transform: translateY(-150px) scale(1); }
    62%  { transform: translateY(-150px) scale(1); }
    100% { transform: translateY(0) scale(1); }
  }
  /* กล่องหายไปหลังแก้วโผล่ */
  .open .box { animation: boxOut .5s ease .8s forwards; }
  @keyframes boxOut { to { opacity: 0; transform: translateY(40px) scale(.7); } }
  .open .buddy.bounce { animation: bounce .6s ease; }
  @keyframes bounce { 0%,100% { transform: translateY(-136px); } 40% { transform: translateY(-156px) scale(1.04,.96); } }

  .box {
    position: absolute; left: 30px; right: 30px; bottom: 0; height: 150px; z-index: 2;
    background: var(--berry); border: 5px solid var(--line); border-radius: 10px 10px 22px 22px;
    box-shadow: inset 0 -14px 0 var(--berry-dark);
  }
  .box::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 30px; transform: translateX(-50%); background: var(--gold); border-left: 4px solid var(--line); border-right: 4px solid var(--line); }
  .box::after { /* หน้ายิ้มบนกล่อง */
    content: "ᵔᴥᵔ"; position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    font: 700 1.1rem system-ui, sans-serif; color: var(--line); background: #fff; padding: 0 8px; border-radius: 8px; border: 3px solid var(--line);
  }
  .lid {
    position: absolute; left: 16px; right: 16px; bottom: 140px; height: 46px; z-index: 3;
    background: var(--berry); border: 5px solid var(--line); border-radius: 12px;
    box-shadow: inset 0 -8px 0 var(--berry-dark); transform-origin: 20% 100%;
  }
  .lid::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 30px; transform: translateX(-50%); background: var(--gold); border-left: 4px solid var(--line); border-right: 4px solid var(--line); }
  .bow { position: absolute; left: 50%; bottom: 36px; }
  .bow i { position: absolute; bottom: 0; width: 54px; height: 40px; background: var(--gold); border: 5px solid var(--line); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
  .bow i:nth-child(1) { right: 0; transform: rotate(-22deg); }
  .bow i:nth-child(2) { left: 0; transform: rotate(22deg); }
  .bow b { position: absolute; left: -12px; bottom: -6px; width: 24px; height: 24px; background: var(--gold); border: 5px solid var(--line); border-radius: 50%; }

  .idle { animation: wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle { 0%,84%,100% { transform: rotate(0); } 88% { transform: rotate(-3deg); } 92% { transform: rotate(3deg); } 96% { transform: rotate(-2deg); } }
  .shake-1 { animation: shake .35s ease; }
  .shake-2 { animation: shake .3s ease 2; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg) translateY(-6px); } 75% { transform: rotate(7deg) translateY(-6px); } }
  .open .lid { animation: pop .8s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes pop { to { transform: translate(110px, -190px) rotate(40deg); opacity: 0; } }

  .taps { display: flex; gap: 10px; justify-content: center; }
  .taps span { width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--berry); transition: background .2s; }
  .taps span.on { background: var(--berry); }
  .open-state .taps { display: none; }

  /* ===== คำพูดของแก้ว ===== */
  .bubble {
    position: absolute; left: 50%; bottom: 250px; z-index: 4;
    width: min(300px, 88vw); padding: 14px 16px 12px;
    background: var(--paper); border: 4px solid var(--line); border-radius: 22px;
    opacity: 0; transform: translate(-50%, 12px) scale(.9); transform-origin: 50% 100%; pointer-events: none;
    transition: opacity .35s ease 1.75s, transform .5s cubic-bezier(.3,1.6,.5,1) 1.75s;
  }
  .bubble::before {
    content: ""; position: absolute; left: 50%; bottom: -14px; margin-left: -11px; width: 20px; height: 20px;
    background: var(--paper); border-right: 4px solid var(--line); border-bottom: 4px solid var(--line); transform: rotate(45deg);
  }
  .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  /* กล่องข้อความลอยขึ้นลงเบา ๆ (เริ่มหลังเด้งขึ้นมาเสร็จ) */
  .bubble.show { animation: bob 2.8s ease-in-out 2.3s infinite; }
  @keyframes bob { 0%, 100% { translate: 0 0; rotate: 0deg; } 50% { translate: 0 -6px; rotate: -.6deg; } }
  .msg { font-weight: 700; font-size: 1.15rem; line-height: 1.55; margin: 0; color: var(--berry-dark); text-wrap: balance; }
  .msg.long { font-size: 1.05rem; }
  .from { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
  .again {
    margin-top: 18px; font: 700 1.05rem "Mali", system-ui, sans-serif; color: var(--line);
    background: var(--gold); border: 4px solid var(--line); border-radius: 999px; padding: 10px 22px;
    box-shadow: 0 5px 0 var(--line); cursor: pointer;
  }
  .again:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .again:focus-visible { outline: 3px solid var(--berry); outline-offset: 4px; }


  /* ===== น้องมัทฉะขยับ ===== */
  .buddy * { transform-box: fill-box; }
  .body { transform-origin: 50% 100%; animation: breathe 2.8s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.035,.965); } }
  .pearl { transform-origin: 30% 100%; animation: pearl 2.8s ease-in-out infinite; }
  @keyframes pearl { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(3px) rotate(-8deg); } }
  .armL { transform-origin: 100% 100%; animation: waveL 1.4s ease-in-out infinite; }
  .armR { transform-origin: 0% 100%; animation: waveR 2.8s ease-in-out infinite; }
  @keyframes waveL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-22deg); } }
  @keyframes waveR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(10deg); } }
  #e-normal, #e-teary { transform-origin: 50% 50%; animation: blink 4s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  #e-heart { transform-origin: 50% 50%; animation: thump .9s ease-in-out infinite; }
  @keyframes thump { 0%,100% { transform: scale(1); } 30% { transform: scale(1.18); } 60% { transform: scale(.95); } }
  .cheek { transform-origin: 50% 50%; animation: blush 2.8s ease-in-out infinite; }
  @keyframes blush { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
  .prop { transform-origin: 50% 50%; animation: float 2.2s ease-in-out infinite; }
  #p-sun { animation: spin 8s linear infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(4deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ตอนยังไม่เปิด: แขนนิ่ง ประหยัดแรง */
  .gift:not(.open) .arm, .gift:not(.open) .prop { animation-play-state: paused; }
  /* แตะตัวน้องมัทฉะหลังเปิดแล้ว: ดิ้นดุ๊กดิ๊ก */
  .open .buddy.giggle .body { animation: giggle .5s ease; }
  @keyframes giggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-8deg) scale(1.05,.95); } 50% { transform: rotate(8deg) scale(.96,1.05); } 80% { transform: rotate(-4deg); } }
  /* ===== ช่องทางติดต่อ ===== */
  main { flex: 1; }
  footer { padding: 8px 24px 24px; text-align: center; color: var(--muted); font-size: .85rem; }
  .social { display: flex; justify-content: center; gap: 12px; margin: 0 0 8px; padding: 0; list-style: none; }
  .social a {
    width: 36px; height: 36px; display: grid; place-items: center;
    color: #5E7D33; background: rgba(255,255,255,.6); border: 1.5px solid rgba(94,125,51,.45); border-radius: 50%;
    font-size: 1rem; text-decoration: none; transition: transform .12s, background .12s;
  }
  .social a svg, .social .fallback { color: inherit; }
  .social a:active { transform: scale(.92); background: rgba(255,255,255,.9); }
  .social a:focus-visible { outline: 2px solid var(--berry); outline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .social a { color: #B7CF8E; background: rgba(255,255,255,.07); border-color: rgba(183,207,142,.45); }
  }
  :root[data-theme="dark"] .social a { color: #B7CF8E; background: rgba(255,255,255,.07); border-color: rgba(183,207,142,.45); }
  .social a[aria-disabled="true"] { cursor: default; }
  .social .fallback { font: 600 .7rem "Mitr", system-ui, sans-serif; }
  .fontawesome-i2svg-complete .social .fallback { display: none; }
  .legL { transform-origin: 50% 0%; animation: tapL 1.4s ease-in-out infinite; }
  .legR { transform-origin: 50% 0%; animation: tapR 1.4s ease-in-out infinite; }
  @keyframes tapL { 0%,40%,100% { transform: translateY(0) rotate(0); } 20% { transform: translateY(-4px) rotate(8deg); } }
  @keyframes tapR { 0%,50%,90%,100% { transform: translateY(0) rotate(0); } 70% { transform: translateY(-4px) rotate(-8deg); } }
  .gift:not(.open) .leg { animation-play-state: paused; }
  .buddy.no-legs .legs { display: none; }
  /* ===== ปุ่มเปิด/ปิดเสียง ===== */
  .sound-btn {
    position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 6;
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; padding: 0;
    font-size: .95rem; cursor: pointer; color: #5E7D33;
    background: rgba(255,255,255,.6); border: 1.5px solid rgba(94,125,51,.45);
    -webkit-tap-highlight-color: transparent; transition: transform .12s, background .12s;
  }
  .sound-btn > span { display: grid; place-items: center; }
  .sound-btn > span[hidden] { display: none; }
  .sound-btn .fallback { font: 600 .62rem "Mitr", system-ui, sans-serif; }
  .fontawesome-i2svg-complete .sound-btn .fallback { display: none; }
  .sound-btn:active { transform: scale(.92); background: rgba(255,255,255,.9); }
  .sound-btn:focus-visible { outline: 2px solid var(--berry); outline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .sound-btn { color: #B7CF8E; background: rgba(255,255,255,.07); border-color: rgba(183,207,142,.45); }
  }
  :root[data-theme="dark"] .sound-btn { color: #B7CF8E; background: rgba(255,255,255,.07); border-color: rgba(183,207,142,.45); }
  canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  @media (prefers-reduced-motion: reduce) {
    .idle, .shake-1, .shake-2, .open .buddy.bounce, .buddy *, .open .buddy.giggle .body { animation: none !important; }
    .open .lid { animation: none; opacity: 0; }
    .buddy, .bubble { transition-duration: .01s; transition-delay: 0s; }
    .open .buddy { animation: none; transform: none; }
    .open .box { animation: none; opacity: 0; }
    .bubble.show { animation: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/brands.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/solid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/fontawesome.min.js"></script>
<style>
  /* โหมดมืด: ข้อความอวยพรสีอ่อนให้อ่านง่าย */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg { color: #D3E6AE; } }
  :root[data-theme="dark"] .msg { color: #D3E6AE; }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="sound-btn" id="soundBtn" aria-label="ปิดเสียง" aria-pressed="false">
  <span class="ico-on"><i class="fa-solid fa-volume-high"></i><span class="fallback" aria-hidden="true">เสียง</span></span>
  <span class="ico-off" hidden><i class="fa-solid fa-volume-xmark"></i><span class="fallback" aria-hidden="true">ปิด</span></span>
</button>
<main id="app">
  <h1 id="headline">มีใครบางคนซ่อนอยู่ในแก้วนี้</h1>
  <p class="sub" id="sub">แตะกล่อง 3 ครั้งเพื่อเปิด</p>
  <div class="name-field">
    <input id="nick" type="text" maxlength="20" autocomplete="nickname" enterkeyhint="done"
      placeholder="ใส่ชื่อเล่น (ไม่ใส่ก็ได้)" aria-label="ชื่อเล่น ไม่บังคับ">
  </div>

  <div class="stage">
    <button class="gift idle" id="gift" aria-label="แตะเพื่อเปิดกล่องของขวัญ">
      <!-- ตัวการ์ตูน "น้องมัทฉะ" แก้วมัทฉะพร้อมโลโก้ร้าน -->
      <svg class="buddy" id="buddy" viewBox="0 0 180 236" aria-hidden="true">
        <defs>
          <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F6F1E1"/><stop offset=".34" stop-color="#F6F1E1"/>
            <stop offset=".42" stop-color="#A9C47E"/><stop offset="1" stop-color="#6B8C3A"/>
          </linearGradient>
        </defs>
        <g id="p-hearts" class="prop">
          <path d="M158 34 c-6-10 -20-4 -14 6 l14 14 l14-14 c6-10 -8-16 -14-6z" fill="#FF7FA2" stroke="#3A3325" stroke-width="3"/>
          <path d="M20 46 c-4-7 -14-3 -10 4 l10 10 l10-10 c4-7 -6-11 -10-4z" fill="#FF7FA2" stroke="#3A3325" stroke-width="3"/>
        </g>
        <g id="p-sun" class="prop">
          <circle cx="156" cy="36" r="13" fill="#FFD36B" stroke="#3A3325" stroke-width="3"/>
          <g stroke="#3A3325" stroke-width="3" stroke-linecap="round">
            <line x1="156" y1="13" x2="156" y2="7"/><line x1="176" y1="36" x2="170" y2="36"/><line x1="136" y1="36" x2="142" y2="36"/>
            <line x1="171" y1="21" x2="167" y2="25"/><line x1="141" y1="21" x2="145" y2="25"/><line x1="171" y1="51" x2="167" y2="47"/>
          </g>
        </g>
        <g id="p-stars" class="prop" fill="#FFD36B" stroke="#3A3325" stroke-width="3" stroke-linejoin="round">
          <path d="M156 18 l5 11 12 1 -9 8 3 12 -11-6 -11 6 3-12 -9-8 12-1z"/>
          <path d="M22 36 l3 7 8 1 -6 5 2 8 -7-4 -7 4 2-8 -6-5 8-1z"/>
        </g>
        <g id="p-letter" class="prop">
          <rect x="136" y="22" width="40" height="28" rx="4" fill="#fff" stroke="#3A3325" stroke-width="3"/>
          <path d="M136 24 l20 14 l20-14" fill="none" stroke="#3A3325" stroke-width="3"/>
          <path d="M156 42 c-2-4 -8-2 -6 2 l6 6 l6-6 c2-4 -4-6 -6-2z" fill="#FF7FA2"/>
        </g>

        <g class="arm armL">
          <path d="M38 132 q-22 -10 -20 -36" fill="none" stroke="#3A3325" stroke-width="5" stroke-linecap="round"/>
          <circle cx="18" cy="94" r="9" fill="#F6F1E1" stroke="#3A3325" stroke-width="4"/>
        </g>
        <g class="arm armR">
          <path d="M142 132 q22 -10 20 -36" fill="none" stroke="#3A3325" stroke-width="5" stroke-linecap="round"/>
          <circle cx="162" cy="94" r="9" fill="#F6F1E1" stroke="#3A3325" stroke-width="4"/>
        </g>

        <g class="legs" id="legs">
          <g class="leg legL">
            <path d="M72 196 L70 220" stroke="#3A3325" stroke-width="6" stroke-linecap="round"/>
            <path d="M56 226 q0 -10 14 -10 q12 0 12 10 z" fill="#F3EAD0" stroke="#3A3325" stroke-width="4" stroke-linejoin="round"/>
          </g>
          <g class="leg legR">
            <path d="M108 196 L110 220" stroke="#3A3325" stroke-width="6" stroke-linecap="round"/>
            <path d="M98 226 q0 -10 12 -10 q14 0 14 10 z" fill="#F3EAD0" stroke="#3A3325" stroke-width="4" stroke-linejoin="round"/>
          </g>
        </g>
        <g class="body">
          <!-- หลอด -->
          <g class="pearl">
            <path d="M100 66 L112 6 L124 8 L112 66Z" fill="#6B8C3A" stroke="#3A3325" stroke-width="4" stroke-linejoin="round"/>
          </g>
          <!-- ฝาโดม -->
          <path d="M30 66 Q90 20 150 66Z" fill="#FFFFFF" fill-opacity=".75" stroke="#3A3325" stroke-width="4.5" stroke-linejoin="round"/>
          <rect x="24" y="62" width="132" height="12" rx="6" fill="#FFFFFF" stroke="#3A3325" stroke-width="4.5"/>
          <!-- ตัวแก้ว -->
          <path d="M33 74 L147 74 L135 198 Q90 206 45 198Z" fill="url(#tea)" stroke="#3A3325" stroke-width="5" stroke-linejoin="round"/>
          <path d="M44 84 L40 124" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>

/* ================================================================
   เสียง (สังเคราะห์ในเบราว์เซอร์ ไม่ต้องโหลดไฟล์)
   ================================================================ */
const Sound = (() => {
  let ctx = null, master = null, musicTimer = null, musicOn = false;
  let muted = false;
  try { muted = localStorage.getItem("muted") === "1"; } catch (e) {}

  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.8;
    master.connect(ctx.destination);
  }
  function tone(freq, at, dur, type = "sine", vol = .2, glideTo = null) {
    if (!ctx) return;
    const t = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur * .8);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12);   // MIDI note → Hz

  const sfx = {
    tap(n) {           // ป๊อก ๆ เสียงสูงขึ้นทุกครั้งที่แตะ
      const base = [72, 76, 79][Math.min(n, 3) - 1] || 72;
      tone(N(base), 0, .16, "triangle", .25, N(base + 7));
      tone(N(base + 12), .03, .1, "sine", .08);
    },
    open() {           // ป๊อป! + วิ้งค์ ๆ
      tone(900, 0, .18, "sine", .3, 160);
      [84, 88, 91, 96, 100].forEach((n, i) => tone(N(n), .12 + i * .07, .5, "triangle", .12));
    },
    boing() {          // ตอนแตะน้องมัทฉะ
      tone(N(67), 0, .28, "sine", .25, N(79));
      tone(N(79), .12, .22, "sine", .15, N(72));
    }
  };

  /* เพลงกล่องดนตรีสั้น ๆ (แต่งขึ้นเอง) วนเบา ๆ */
  const BPM = 92, beat = 60 / BPM;
  const melody = [
    [72,1],[76,1],[79,1],[76,1], [77,1],[81,1],[79,2],
    [76,1],[79,1],[84,1],[83,1], [81,1],[79,1],[76,2],
    [74,1],[77,1],[81,1],[79,1], [76,1],[72,1],[74,2],
    [76,1],[79,1],[81,1],[79,1], [84,4]
  ];
  const bass = [48, 53, 52, 57, 50, 55, 53, 48];   // 1 ตัวต่อ 4 จังหวะ
  const loopBeats = melody.reduce((a, [, b]) => a + b, 0);

  function scheduleLoop() {
    if (!ctx || !musicOn) return;
    let t = .05;
    melody.forEach(([n, b]) => {
      tone(N(n), t, Math.max(.5, b * beat * 1.2), "sine", .09);
      tone(N(n + 12), t, .35, "triangle", .025);          // ประกายกล่องดนตรี
      t += b * beat;
    });
    bass.forEach((n, i) => tone(N(n), .05 + i * 4 * beat, 4 * beat, "sine", .05));
    musicTimer = setTimeout(scheduleLoop, loopBeats * beat * 1000);
  }

  return {
    init, sfx,
    startMusic() { if (musicOn || !ctx) return; musicOn = true; scheduleLoop(); },
    isMuted: () => muted,
    setMuted(v) {
      muted = v;
      try { localStorage.setItem("muted", v ? "1" : "0"); } catch (e) {}
      if (master) master.gain.setTargetAtTime(v ? 0 : .8, ctx.currentTime, .05);
    },
    pause() { if (ctx && ctx.state === "running") ctx.suspend(); },
    resume() { if (ctx && ctx.state === "suspended") ctx.resume(); }
  };
})();

const soundBtn = document.getElementById("soundBtn");
function paintSoundBtn() {
  const m = Sound.isMuted();
  soundBtn.querySelector(".ico-on").hidden = m;
  soundBtn.querySelector(".ico-off").hidden = !m;
  soundBtn.setAttribute("aria-pressed", String(m));
  soundBtn.setAttribute("aria-label", m ? "เปิดเสียง" : "ปิดเสียง");
}
soundBtn.addEventListener("click", () => { Sound.init(); Sound.setMuted(!Sound.isMuted()); paintSoundBtn(); });
paintSoundBtn();
document.addEventListener("visibilitychange", () => document.hidden ? Sound.pause() : Sound.resume());

const MOODS = {
  love:  { eyes: "e-heart",  mouth: "m-smile", prop: "p-hearts", fx: "hearts" },
  miss:  { eyes: "e-teary",  mouth: "m-pout",  prop: "p-letter", fx: "hearts" },
  day:   { eyes: "e-happy",  mouth: "m-open",  prop: "p-sun",    fx: "confetti" },
  cheer: { eyes: "e-normal", mouth: "m-open",  prop: "p-stars",  fx: "confetti" },
  hug:   { eyes: "e-happy",  mouth: "m-smile", prop: "p-hearts", fx: "hearts" }
};

/* ?to=ชื่อ  และ  ?msg=ข้อความเฉพาะ (ใช้เป็นข้อความแรก) */
const params = new URLSearchParams(location.search);
const toName = params.get("to");
const customMsg = params.get("msg");
const nickInput = document.getElementById("nick");
const headline = document.getElementById("headline");
const DEFAULT_HEAD = headline.textContent;
try { nickInput.value = toName || localStorage.getItem("nick") || ""; } catch (e) { nickInput.value = toName || ""; }

function getNick() { return nickInput.value.trim().slice(0, 20); }
function fillName(text, name) {
  // {name} = ชื่อเล่น, {name|เธอ} = ถ้าไม่กรอกชื่อ ใช้คำว่า "เธอ" แทน
  return text.replace(/\{name(?:\|([^}]*))?\}/g, (_, fb) => name || fb || "")
             .replace(/\s+/g, " ").trim();
}
function updateHeadline() {
  const n = getNick();
  headline.textContent = n ? `${n} มีใครบางคนรออยู่` : DEFAULT_HEAD;
}
nickInput.addEventListener("input", updateHeadline);
nickInput.addEventListener("keydown", e => { if (e.key === "Enter") { nickInput.blur(); gift.focus(); } });
updateHeadline();

const app = document.getElementById("app");
const gift = document.getElementById("gift");
const buddy = document.getElementById("buddy");
const dots = document.querySelectorAll(".taps span");
const sub = document.getElementById("sub");
const bubble = document.getElementById("bubble");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hints = ["แตะกล่อง 3 ครั้งเพื่อเปิด", "ได้ยินเสียงอะไรข้างใน…", "อีกครั้งเดียว!"];
let taps = 0, opened = false, lastIndex = -1;

function setFace(moodKey) {
  const m = MOODS[moodKey] || MOODS.love;
  buddy.querySelectorAll(".eyes, .mouth, .prop").forEach(el => el.style.display = "none");
  [m.eyes, m.mouth, m.prop].forEach(id => document.getElementById(id).style.display = "");
  return m;
}
setFace("love");

/* 1 วัน = 1 ข้อความต่อเครื่อง (สแกนซ้ำวันเดียวกันได้ข้อความเดิม พรุ่งนี้ได้ใหม่) */
const PREVIEW = new URLSearchParams(location.search).has("preview");
function dailyMessage() {
  if (!CONFIG.oncePerDay || PREVIEW) return pickMessage();   // โหมดดูตัวอย่าง: รีเฟรชแล้วได้ข้อความใหม่
  const d = new Date(), key = `msg-${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  try {
    const saved = localStorage.getItem(key);
    if (saved !== null && CONFIG.messages[+saved]) return +saved;
    const i = pickMessage(); localStorage.setItem(key, i); return i;
  } catch (e) { return pickMessage(); }
}
/* สุ่มข้อความ โดยไม่ซ้ำกับ 6 ข้อความล่าสุดที่เครื่องนี้เคยเห็น */
function pickMessage() {
  const n = CONFIG.messages.length;
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem("recentMsgs") || "[]"); } catch (e) {}
  const keep = Math.min(6, n - 1);
  recent = recent.filter(i => i < n).slice(-keep);
  const pool = [...Array(n).keys()].filter(i => !recent.includes(i));
  const i = pool[Math.floor(Math.random() * pool.length)];
  try { localStorage.setItem("recentMsgs", JSON.stringify([...recent, i].slice(-keep))); } catch (e) {}
  return i;
}

function reveal(first) {
  let item;
  if (first && customMsg) item = { mood: "love", text: customMsg };
  else { lastIndex = dailyMessage(); item = CONFIG.messages[lastIndex]; }
  const m = setFace(item.mood);
  const msgEl = document.getElementById("msg");
  msgEl.textContent = fillName(item.text, getNick());
  msgEl.classList.toggle("long", msgEl.textContent.length > 16);
  document.getElementById("from").textContent = CONFIG.from;
  if (!reduceMotion) burst(m.fx);
}

gift.addEventListener("click", () => {
  Sound.init();
  if (opened) {
    Sound.sfx.boing();
    buddy.classList.remove("giggle"); void buddy.offsetWidth; buddy.classList.add("giggle");
    if (navigator.vibrate) navigator.vibrate(20);
    if (!reduceMotion) burst("hearts");
    return;
  }
  taps++;
  if (taps < 3) Sound.sfx.tap(taps);
  dots.forEach((d, i) => d.classList.toggle("on", i < taps));
  if (navigator.vibrate) navigator.vibrate(taps < 3 ? 30 : [40, 40, 90]);
  if (taps >= 3) {
    opened = true;
    gift.classList.remove("idle", "shake-1", "shake-2");
    gift.classList.add("open");
    app.classList.add("open-state");
    gift.setAttribute("aria-label", "เปิดกล่องแล้ว");
    const n = getNick();
    try { if (n) localStorage.setItem("nick", n); } catch (e) {}
    nickInput.blur();
    headline.textContent = n ? `ถึง ${n} 💌` : "แก้วมัทฉะมีอะไรจะบอก";
    sub.textContent = "ลองแตะน้องมัทฉะดูสิ";
    Sound.sfx.open();
    setTimeout(() => Sound.startMusic(), 1600);
    reveal(true);
    bubble.classList.add("show");
    return;
  }
  sub.textContent = hints[taps];
  gift.classList.remove("idle", "shake-1", "shake-2");
  void gift.offsetWidth;
  gift.classList.add(taps === 1 ? "shake-1" : "shake-2");
  gift.addEventListener("animationend", () => {
    gift.classList.remove("shake-1", "shake-2");
    if (!opened) gift.classList.add("idle");
  }, { once: true });
});



/* ===== เอฟเฟกต์: หัวใจลอย / คอนเฟตตี ===== */
function burst(kind) {
  const c = document.getElementById("fx"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = gift.getBoundingClientRect();
  const ox = r.left + r.width / 2, oy = r.top + r.height * .35;
  const colors = ["#6B8C3A", "#A9C47E", "#F3EAD0", "#FF8FB1", "#FFFFFF"];
  const hearts = kind === "hearts";
  const parts = Array.from({ length: hearts ? 40 : 130 }, () => ({
    x: hearts ? ox + (Math.random() - .5) * 180 : ox,
    y: hearts ? oy + Math.random() * 60 : oy,
    vx: hearts ? (Math.random() - .5) * 1.2 : (Math.random() - .5) * 14,
    vy: hearts ? -Math.random() * 2.5 - 1.5 : -Math.random() * 16 - 4,
    s: hearts ? 10 + Math.random() * 14 : 6 + Math.random() * 6,
    rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
    c: hearts ? ["#6B8C3A", "#FF8FB1", "#A9C47E"][Math.floor(Math.random() * 3)] : colors[Math.floor(Math.random() * colors.length)],
    ph: Math.random() * 6
  }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      if (hearts) { p.x += p.vx + Math.sin(f * .05 + p.ph) * .6; p.y += p.vy; }
      else { p.vy += .45; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = Math.max(0, 1 - f / 170); ctx.fillStyle = p.c;
      if (hearts) {
        const s = p.s / 2; ctx.beginPath();
        ctx.moveTo(0, s * .9);
        ctx.bezierCurveTo(-s * 1.6, -s * .2, -s * .6, -s * 1.4, 0, -s * .5);
        ctx.bezierCurveTo(s * .6, -s * 1.4, s * 1.6, -s * .2, 0, s * .9);
        ctx.fill();
      } else { ctx.rotate(p.rot); ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 1.4 * Math.cos(f * .1 + p.ph)); }
      ctx.restore();
    });
    if (++f < 180) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
